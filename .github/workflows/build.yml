{"name": "Build APK", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Descomprimir", "run": "mkdir src && unzip -q shooter.zip -d src"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "URL del repo", "run": "sed -i \"s|REPO_PLACEHOLDER|${{ github.repository }}|\" src/app/src/main/java/com/zapia/shooter/LauncherActivity.kt"}, {"name": "Compilar", "run": "cd src && gradle assembleDebug --no-daemon"}, {"name": "Empaquetar", "run": "cd src/gamedata && zip -r ../../gamedata.zip ."}, {"uses": "actions/upload-artifact@v4", "with": {"name": "shooter-apk", "path": "src/app/build/outputs/apk/debug/app-debug.apk"}}, {"uses": "softprops/action-gh-release@v2", "with": {"tag_name": "latest-build", "files": "src/app/build/outputs/apk/debug/app-debug.apk\ngamedata.zip"}}]}}}
