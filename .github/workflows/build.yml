{"name":"Build APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","env":{"KEYSTORE_PASSWORD":"${{ secrets.KEYSTORE_PASSWORD }}","VERSION_CODE":"${{ github.run_number }}"},"steps":[{"uses":"actions/checkout@v4"},{"name":"Descomprimir","run":"mkdir src && unzip -q shooter.zip -d src"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Clave","env":{"KS":"${{ secrets.KEYSTORE_B64 }}"},"run":"echo \"$KS\" | base64 -d > $RUNNER_TEMP/upload.p12 && echo \"KEYSTORE_PATH=$RUNNER_TEMP/upload.p12\" >> $GITHUB_ENV"},{"name":"Compilar","run":"cd src && gradle assembleRelease bundleRelease --no-daemon"},{"name":"Empaquetar archivos de juego","run":"cd src/app/src/main/assets/gamedata && zip -q -r ../../../../../../gamedata.zip ."},{"name":"Copiar","run":"mkdir out && cp src/app/build/outputs/apk/release/*.apk out/shooter.apk && cp src/app/build/outputs/bundle/release/*.aab out/shooter.aab && printf '%s\\n' \"$VERSION_CODE\" > out/version.txt"},{"uses":"actions/upload-artifact@v4","with":{"name":"shooter","path":"out/*"}},{"uses":"softprops/action-gh-release@v2","with":{"tag_name":"latest-build","files":"out/shooter.apk\nout/shooter.aab\ngamedata.zip\nout/version.txt"}}]}}}
